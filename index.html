<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thi đua lớp 11A2</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--mut:#5b667a;--bg:#eef2f7;--card:#fff;--line:#dbe2ec;--good:#17803d;--bad:#c62828;--pri:#1d4ed8;--t1:#1d4ed8;--t2:#15803d;--t3:#d97706;--t4:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;font-weight:800;letter-spacing:.2px;cursor:pointer}
header small{opacity:.8}
main{max-width:1000px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--pri);color:#fff;font-weight:500;cursor:pointer}
.btn.g{background:#e3e9f3;color:var(--ink)}.btn.r{background:var(--bad)}.btn.s{padding:4px 10px;font-size:13px}.btn.ok{background:var(--good)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #93b4ff;outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tile{border:0;border-left:8px solid var(--c);background:var(--card);border-radius:10px;padding:18px 16px;text-align:left;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tile b{font-size:26px;display:block;color:var(--c)}.tile span{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{font-size:24px;display:block}.stat.v b{color:var(--bad)}.stat.n b{color:var(--good)}
.mem{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.mem:first-child{border-top:0}.mem.me{background:#f1f6ff}
.mem .nm{flex:1;min-width:120px;font-weight:500}
.sc{font-weight:800;min-width:46px;text-align:right}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:500}
.tag.v{background:#fde8e8;color:var(--bad)}.tag.n{background:#e3f6ea;color:var(--good)}
.det{background:#f7f9fc;border-radius:8px;padding:10px;margin:0 0 8px}
.rec{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.rec .it{flex:1;min-width:140px}.p{font-weight:700}.p.pos{color:var(--good)}.p.neg{color:var(--bad)}
.wk{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.wk button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:34px;padding:3px 4px;font-size:12px;cursor:pointer}
.wk .bad{background:#fde8e8;border-color:#f3b4b4}.wk .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{white-space:nowrap;border:0;background:#e3e9f3;border-radius:8px;padding:8px 14px;cursor:pointer}
.tabs .on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
tr[data-a]{cursor:pointer}
.mut{color:var(--mut)}.pend{font-size:12px;color:#b45309;font-weight:500}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal>div{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:380px}
.modal form{display:grid;gap:10px}
.err{color:var(--bad);font-size:13px;min-height:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;z-index:30;display:none}
.only-print{display:none}
@media(max-width:560px){main{padding:10px}.stats{gap:6px}.stat b{font-size:20px}}
@media print{header,.noprint,.tabs{display:none!important}body{background:#fff}.card{border:0;padding:0}.only-print{display:block}.screen{display:none}main{max-width:none}}
</style>
</head>
<body>
<header><h1 data-a="home">Thi đua lớp 11A2</h1><small id="who"></small><button class="btn g s" id="out" data-a="logout" style="display:none">Đăng xuất</button></header>
<main id="app"><div class="card"><h2>Đang tải…</h2><p class="mut" style="margin:0">Nếu màn hình này không thay đổi, hãy mở trang qua máy chủ web (không mở trực tiếp file) và kiểm tra kết nối mạng.</p></div></main>
<div id="toast"></div>
<script type="module">
const B="https://www.gstatic.com/firebasejs/10.12.2/";
let M;
try{
  const [a,b,c]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-database.js")]);
  M={...a,...b,...c};
}catch(e){
  document.getElementById("app").innerHTML=`<div class="card"><h2>Không tải được Firebase</h2><p>Trình duyệt không kết nối được tới <code>gstatic.com</code>, hoặc bạn đang mở file trực tiếp (file://). Hãy mở trang qua máy chủ web (Firebase Hosting, GitHub Pages hoặc <code>npx serve</code>) và kiểm tra mạng.</p><p class="mut">Chi tiết: ${String(e.message||e)}</p></div>`;
  throw e;
}
const {initializeApp,getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,getDatabase,ref,onValue,get,set,push,update,remove}=M;

const cfg={apiKey:"AIzaSyDDHoie6vCkj_HOibHzN-VZ4PEXKpwfujU",authDomain:"csdl-11a2.firebaseapp.com",databaseURL:"https://csdl-11a2-default-rtdb.firebaseio.com",projectId:"csdl-11a2",storageBucket:"csdl-11a2.firebasestorage.app",messagingSenderId:"527409951361",appId:"1:527409951361:web:c28965e470649aad2dd380"};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
const ADMIN="congthanh.edu.vn@gmail.com";
const ITEMS=[["Trừ điểm",[["Đi học muộn",-2],["Không làm bài tập",-3],["Không thuộc bài",-2],["Nói chuyện riêng trong giờ",-2],["Mất trật tự",-3],["Sai đồng phục",-2],["Vứt rác bừa bãi",-2],["Dùng điện thoại trong giờ",-5],["Nghỉ học không phép",-5],["Đánh nhau, mất đoàn kết",-10]]],
["Cộng điểm",[["Phát biểu xây dựng bài",2],["Điểm 9–10",3],["Giúp đỡ bạn bè",2],["Trực nhật tốt",2],["Tham gia phong trào",3],["Việc tốt được khen",5]]]];
const FLAT=ITEMS.flatMap(g=>g[1]);
const WEEKS=Array.from({length:29},(_,i)=>i+7);
const COL=["","var(--t1)","var(--t2)","var(--t3)","var(--t4)"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={user:null,role:null,to:null,name:"",view:"home",tab:"rank",week:7,rw:0,sel:null,members:{},records:{},requests:{},users:{},pending:null};
let unsubs=[];

const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)};
const mem=to=>Object.entries(S.members).filter(([,m])=>m.to==to).map(([id,m])=>({id,...m}));
const recs=()=>Object.entries(S.records).map(([id,r])=>({id,...r}));
const sc=(mid,wk)=>100+recs().filter(r=>r.mid==mid&&(!wk||r.week==wk)).reduce((a,r)=>a+r.pts,0);
const isBad=(mid,wk)=>recs().some(r=>r.mid==mid&&r.pts<0&&(!wk||r.week==wk));
const sg=n=>(n>0?"+":"")+n;
const DOM="@11a2.edu.vn";
const toEmail=s=>{s=s.trim();return s.includes("@")?s:s.toLowerCase()+DOM};
const userName=e=>String(e||"").endsWith(DOM)?e.slice(0,-DOM.length):e;
const pendFor=id=>Object.values(S.requests).some(q=>q.rid==id&&q.status=="pending");
const canLead=to=>S.role=="leader"&&S.to==to;
const can=v=>S.role=="admin"||(v!="admin"&&S.to==v);
const weekOpts=(cur,all)=>(all?`<option value="0" ${cur==0?"selected":""}>Tất cả các tuần</option>`:"")+WEEKS.map(w=>`<option value="${w}" ${w==cur?"selected":""}>Tuần ${w}</option>`).join("");

/* ---------- Auth & dữ liệu ---------- */
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){Object.assign(S,{user:null,role:null,to:null,members:{},records:{},requests:{},users:{},view:"home"});return render();}
  let p=null;
  if(u.email===ADMIN)p={role:"admin",name:"Admin tổng"};
  else{try{p=(await get(ref(db,"users/"+u.uid))).val()}catch(e){}}
  if(!p){toast("Tài khoản chưa được admin phân tổ.");return signOut(auth)}
  Object.assign(S,{user:u,role:p.role,to:p.to||null,name:p.name||u.email});
  const sub=(path,key)=>unsubs.push(onValue(ref(db,path),s=>{S[key]=s.val()||{};render()},e=>toast("Lỗi đọc dữ liệu: "+e.message)));
  sub("members","members");sub("records","records");sub("requests","requests");
  if(p.role=="admin")sub("users","users");
  const t=S.pending||(p.role=="admin"?"admin":p.to);S.pending=null;
  if(can(t)){S.view=t;S.tab="rank"}else{toast("Tài khoản này không thuộc tổ đã chọn.");S.view=p.to||"admin"}
  render();
});

/* ---------- Giao diện ---------- */
function render(){
  $("#who").textContent=S.user?`${S.name} (${{admin:"Admin",leader:"Tổ trưởng",student:"Học sinh"}[S.role]})`:"";
  $("#out").style.display=S.user?"":"none";
  const v=S.view;
  $("#app").innerHTML=v=="home"?home():v=="admin"?adminPage():toPage(v);
}
function home(){
  return `<div class="card"><h2>Chọn tổ để đăng nhập</h2><p class="mut" style="margin:0">Học sinh và tổ trưởng đăng nhập bằng tài khoản do admin cấp. Học sinh chỉ xem được tổ của mình.</p></div>
  <div class="grid">${[1,2,3,4].map(n=>`<button class="tile" style="--c:${COL[n]}" data-a="open" data-v="${n}"><b>Tổ ${n}</b><span>${mem(n).length?mem(n).length+" tổ viên":"Đăng nhập vào tổ"}</span></button>`).join("")}
  <button class="tile" style="--c:var(--ink)" data-a="open" data-v="admin"><b>Admin</b><span>Bảng xếp hạng &amp; duyệt yêu cầu</span></button></div>`;
}
function toPage(to){
  const ms=mem(to),w=S.week,lead=canLead(to);
  const vio=ms.filter(m=>isBad(m.id,w)).length;
  return `<div class="row sp noprint" style="margin-bottom:12px"><h2 style="margin:0;color:${COL[to]}">Tổ ${to}</h2>
    <select data-c="week" aria-label="Chọn tuần">${weekOpts(w)}</select></div>
  <div class="stats"><div class="stat"><span class="mut">Tổ viên</span><b>${ms.length}</b></div>
    <div class="stat v"><span class="mut">Vi phạm</span><b>${vio}</b></div>
    <div class="stat n"><span class="mut">Không vi phạm</span><b>${ms.length-vio}</b></div></div>
  <div class="card"><h3>Tổ viên – tuần ${w}</h3>
    ${ms.length?ms.sort((a,b)=>a.name.localeCompare(b.name,"vi")).map(m=>memRow(m,w,lead)).join(""):`<p class="mut">Chưa có tổ viên.${lead?" Hãy thêm ở bên dưới.":""}</p>`}
    ${lead?`<form class="row" data-f="addmem" style="margin-top:10px"><input name="name" placeholder="Họ tên tổ viên" required style="flex:1"><button class="btn">Thêm tổ viên</button></form>`:""}</div>`;
}
function memRow(m,w,lead){
  const bad=isBad(m.id,w),open=S.sel==m.id,mine=S.user&&S.users&&0;
  let d="";
  if(open){
    const rs=recs().filter(r=>r.mid==m.id&&r.week==w).sort((a,b)=>b.ts-a.ts);
    d=`<div class="det"><div class="mut" style="font-size:13px">Lỗi theo tuần (đỏ = có vi phạm)</div>
      <div class="wk">${WEEKS.map(k=>`<button data-a="wk" data-w="${k}" class="${k==w?"on":isBad(m.id,k)?"bad":""}">${k}</button>`).join("")}</div>
      <h3>Tuần ${w}</h3>${rs.length?rs.map(r=>`<div class="rec"><span class="it">${esc(r.item)}<br><small class="mut">${new Date(r.ts).toLocaleDateString("vi-VN")} · ${esc(r.by)}</small></span>
        <span class="p ${r.pts>0?"pos":"neg"}">${sg(r.pts)}</span>
        ${lead?(pendFor(r.id)?`<span class="pend">Chờ duyệt</span>`:`<button class="btn g s" data-a="redit" data-id="${r.id}">Sửa</button><button class="btn r s" data-a="rdel" data-id="${r.id}">Xóa</button>`):""}</div>`).join(""):`<p class="mut" style="margin:4px 0">Không có ghi nhận nào trong tuần này.</p>`}
      ${lead?`<form class="row" data-f="addrec" data-m="${m.id}" style="margin-top:10px"><select name="i" style="flex:1">${ITEMS.map(g=>`<optgroup label="${g[0]}">${g[1].map(x=>`<option value="${FLAT.indexOf(x)}">${x[0]} (${sg(x[1])})</option>`).join("")}</optgroup>`).join("")}</select><button class="btn ok">Ghi điểm</button></form>
      <button class="btn r s" data-a="delmem" data-m="${m.id}" style="margin-top:10px">Xóa tổ viên</button>`:""}</div>`;
  }
  return `<div class="mem" data-a="sel" data-m="${m.id}"><span class="nm">${esc(m.name)}</span>
    <span class="tag ${bad?"v":"n"}">${bad?"Vi phạm":"Không vi phạm"}</span>
    <span class="mut" style="font-size:13px">Tuần: ${sg(sc(m.id,w)-100)}</span><span class="sc">${sc(m.id)}</span></div>${d}`;
}
function adminPage(){
  const t=S.tab,np=Object.values(S.requests).filter(q=>q.status=="pending").length;
  const tabs=[["rank","Xếp hạng"],["req",`Yêu cầu${np?` (${np})`:""}`],["acc","Tài khoản"],...[1,2,3,4].map(n=>["t"+n,"Tổ "+n])];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button data-a="tab" data-t="${k}" class="${k==t?"on":""}">${l}</button>`).join("")}</div>`+
   (t=="rank"?rankTab():t=="req"?reqTab():t=="acc"?accTab():toPage(+t[1]));
}
function stat(to,w){
  const ms=mem(to),n=ms.length,tot=ms.reduce((a,m)=>a+sc(m.id,w),0);
  const vio=ms.filter(m=>isBad(m.id,w)).length;
  return {to,n,vio,ok:n-vio,avg:n?tot/n:0};
}
function rankTab(){
  const w=S.rw,st=[1,2,3,4].map(n=>stat(n,w)).sort((a,b)=>b.avg-a.avg);
  const lbl=w?"Tuần "+w:"Tất cả các tuần";
  const table=`<table><tr><th>Hạng</th><th>Tổ</th><th>Số HS</th><th>Điểm TB</th><th>Vi phạm</th><th>Không VP</th></tr>
    ${st.map((s,i)=>`<tr data-a="tab" data-t="t${s.to}"><td><b>${i+1}</b></td><td style="color:${COL[s.to]};font-weight:700">Tổ ${s.to}</td><td>${s.n}</td><td><b>${s.avg.toFixed(1)}</b></td><td>${s.vio}</td><td>${s.ok}</td></tr>`).join("")}</table>`;
  const rep=[1,2,3,4].map(n=>`<h3 style="margin-top:16px">Tổ ${n}</h3><table><tr><th>Họ tên</th><th>Điểm</th><th>Ghi nhận ${lbl.toLowerCase()}</th></tr>${mem(n).map(m=>`<tr><td>${esc(m.name)}</td><td>${sc(m.id,w)}</td><td>${recs().filter(r=>r.mid==m.id&&(!w||r.week==w)).map(r=>(w?"":`T${r.week}: `)+esc(r.item)+" ("+sg(r.pts)+")").join("; ")||"—"}</td></tr>`).join("")}</table>`).join("");
  return `<div class="card"><div class="row sp noprint" style="margin-bottom:10px"><h2 style="margin:0">Bảng xếp hạng thi đua</h2><div class="row">
    <select data-c="rw">${weekOpts(w,1)}</select><button class="btn" data-a="print">In / Xuất PDF</button></div></div>
    <h2 class="only-print">Báo cáo thi đua lớp 11A2 – ${lbl}</h2>${table}
    <p class="mut noprint" style="margin:8px 0 0">Điểm TB = trung bình điểm các thành viên (mỗi người bắt đầu từ 100). Bấm vào một tổ để xem chi tiết. Khi in, chọn “Lưu dưới dạng PDF”.</p>
    <div class="only-print">${rep}</div></div>`;
}
function reqTab(){
  const all=Object.entries(S.requests).sort((a,b)=>b[1].ts-a[1].ts);
  return `<div class="card"><h2>Yêu cầu chỉnh sửa từ tổ trưởng</h2>${all.length?all.map(([id,q])=>`<div class="rec"><span class="it"><b>Tổ ${q.to}</b> – ${esc(q.mname)} (tuần ${q.week})<br>
    <small>${q.type=="del"?"Xóa":"Sửa"}: ${esc(q.item)} (${sg(q.pts)})${q.type=="edit"?` → <b>${esc(q.nitem)} (${sg(q.npts)})</b>`:""}<br><span class="mut">${esc(q.by)} · ${new Date(q.ts).toLocaleDateString("vi-VN")}</span></small></span>
    ${q.status=="pending"?`<button class="btn ok s" data-a="approve" data-id="${id}">Duyệt</button><button class="btn r s" data-a="reject" data-id="${id}">Từ chối</button>`:`<span class="tag ${q.status=="approved"?"n":"v"}">${q.status=="approved"?"Đã duyệt":"Đã từ chối"}</span>`}</div>`).join(""):`<p class="mut">Chưa có yêu cầu nào.</p>`}</div>`;
}
function accTab(){
  const us=Object.entries(S.users).sort((a,b)=>(a[1].to||0)-(b[1].to||0)||(a[1].role=="leader"?-1:1));
  return `<div class="card"><h2>Cấp tài khoản cho tổ</h2><form class="row" data-f="newacc">
    <input name="name" placeholder="Họ tên" required><input name="user" placeholder="Tên đăng nhập (vd: to1_an)" required autocapitalize="none"><input name="pw" placeholder="Mật khẩu (≥ 6 ký tự)" minlength="6" required>
    <select name="role"><option value="student">Học sinh</option><option value="leader">Tổ trưởng</option></select>
    <select name="to">${[1,2,3,4].map(n=>`<option value="${n}">Tổ ${n}</option>`).join("")}</select><button class="btn">Tạo tài khoản</button></form></div>
    <div class="card"><h3>Danh sách tài khoản (${us.length})</h3><div class="wrap">${us.length?`<table><tr><th>Họ tên</th><th>Tổ</th><th>Vai trò</th><th>Tên đăng nhập</th><th>Mật khẩu</th><th></th></tr>${us.map(([id,u])=>`<tr><td>${esc(u.name)}</td><td style="color:${COL[u.to]};font-weight:700">Tổ ${u.to}</td><td>${u.role=="leader"?"Tổ trưởng":"Học sinh"}</td><td><code>${esc(userName(u.email))}</code></td><td><code>${esc(u.pw||"—")}</code></td><td><button class="btn r s" data-a="deluser" data-id="${id}">Thu hồi</button></td></tr>`).join("")}</table>`:`<p class="mut">Chưa có tài khoản nào.</p>`}</div></div>`;
}

/* ---------- Hộp thoại ---------- */
function modal(h){closeM();const d=document.createElement("div");d.className="modal";d.id="m";d.innerHTML=`<div>${h}</div>`;d.onclick=e=>{if(e.target==d)closeM()};document.body.appendChild(d)}
function closeM(){$("#m")?.remove()}
function loginModal(v){
  S.pending=v;
  modal(`<h3>${v=="admin"?"Đăng nhập Admin":"Đăng nhập Tổ "+v}</h3><form data-f="login"><input name="e" type="text" placeholder="Tên đăng nhập hoặc email" required autocomplete="username" autocapitalize="none"><input name="p" type="password" placeholder="Mật khẩu" required autocomplete="current-password"><div class="err" id="err"></div><div class="row"><button class="btn">Đăng nhập</button><button type="button" class="btn g" data-a="close">Hủy</button></div></form>`);
}
function editModal(id){
  const r=S.records[id];
  modal(`<h3>Yêu cầu sửa: ${esc(r.item)} (${sg(r.pts)})</h3><form data-f="reqedit" data-id="${id}"><select name="i">${ITEMS.map(g=>`<optgroup label="${g[0]}">${g[1].map(x=>`<option value="${FLAT.indexOf(x)}">${x[0]} (${sg(x[1])})</option>`).join("")}</optgroup>`).join("")}</select><div class="row"><button class="btn">Gửi yêu cầu</button><button type="button" class="btn g" data-a="close">Hủy</button></div></form>`);
}
const sendReq=(id,type,ni)=>{
  const r=S.records[id],m=S.members[r.mid];
  const q={rid:id,type,to:r.to,week:r.week,mname:m?.name||"?",item:r.item,pts:r.pts,by:S.name,ts:Date.now(),status:"pending"};
  if(type=="edit"){q.nitem=FLAT[ni][0];q.npts=FLAT[ni][1]}
  return push(ref(db,"requests"),q).then(()=>toast("Đã gửi yêu cầu, chờ admin duyệt."));
};

/* ---------- Hành động ---------- */
const A={
  home(){S.view="home";render()},
  open(d){const v=d.v=="admin"?"admin":+d.v;if(S.user&&can(v)){S.view=v;S.tab="rank";render()}else if(S.user)toast("Tài khoản của bạn không thuộc tổ này.");else loginModal(v)},
  logout(){signOut(auth)},close:closeM,
  sel(d){S.sel=S.sel==d.m?null:d.m;render()},
  wk(d){S.week=+d.w;render()},
  tab(d){S.tab=d.t;if(d.t[0]=="t")S.sel=null;render()},
  print(){window.print()},
  redit(d){editModal(d.id)},
  rdel(d){if(confirm("Gửi yêu cầu xóa ghi nhận này cho admin?"))sendReq(d.id,"del")},
  async delmem(d){const m=S.members[d.m];if(!confirm(`Xóa "${m.name}" và toàn bộ lịch sử điểm?`))return;
    const up={["members/"+d.m]:null};recs().filter(r=>r.mid==d.m).forEach(r=>up["records/"+r.id]=null);await update(ref(db),up);S.sel=null;toast("Đã xóa tổ viên.")},
  async approve(d){const q=S.requests[d.id],up={["requests/"+d.id+"/status"]:"approved"};
    if(q.type=="del")up["records/"+q.rid]=null;else{up["records/"+q.rid+"/item"]=q.nitem;up["records/"+q.rid+"/pts"]=q.npts}
    if(!S.records[q.rid]){delete up["records/"+q.rid+"/item"];delete up["records/"+q.rid+"/pts"]}
    await update(ref(db),up);toast("Đã duyệt.")},
  reject(d){set(ref(db,"requests/"+d.id+"/status"),"rejected")},
  async deluser(d){if(confirm("Thu hồi quyền của tài khoản này?")){await remove(ref(db,"users/"+d.id))}}
};
const F={
  async login(f){const err=$("#err");try{await signInWithEmailAndPassword(auth,toEmail(f.e.value),f.p.value);closeM()}catch(e){err.textContent="Sai tên đăng nhập hoặc mật khẩu."}},
  async addmem(f){const n=f.name.value.trim();if(!n)return;await push(ref(db,"members"),{name:n,to:S.view});f.reset()},
  async addrec(f,el){const it=FLAT[f.i.value];await push(ref(db,"records"),{to:S.view,week:S.week,mid:el.dataset.m,item:it[0],pts:it[1],ts:Date.now(),by:S.name});toast("Đã ghi điểm.")},
  async reqedit(f,el){await sendReq(el.dataset.id,"edit",f.i.value);closeM()},
  async newacc(f){
    const b=f.querySelector("button");b.disabled=true;const email=toEmail(f.user.value),pw=f.pw.value;
    try{const sec=initializeApp(cfg,"sec"+Date.now()),sa=getAuth(sec);
      const c=await createUserWithEmailAndPassword(sa,email,pw);
      await set(ref(db,"users/"+c.user.uid),{name:f.name.value.trim(),email,pw,role:f.role.value,to:+f.to.value});
      await signOut(sa);toast("Đã tạo tài khoản.");f.reset()}
    catch(e){toast(e.code=="auth/email-already-in-use"?"Tên đăng nhập đã tồn tại.":"Không tạo được: "+e.code)}b.disabled=false}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.closest(".det")&&b.dataset.a=="sel")return;if(e.target.closest("button")&&b.dataset.a=="sel"&&b!==e.target.closest("button"))return;A[b.dataset.a]?.(b.dataset)});
document.addEventListener("change",e=>{const c=e.target.dataset.c;if(c=="week"){S.week=+e.target.value;render()}if(c=="rw"){S.rw=+e.target.value;render()}});
document.addEventListener("submit",e=>{e.preventDefault();const el=e.target;F[el.dataset.f]?.(el,el)});
render();
</script>
</body>
</html>
